<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jon Baldwin | Under construction</title>
  <meta name="description" content="jonmarkbaldwin.com is currently under construction. Back soon.">
  <meta name="robots" content="noindex">

  <link rel="icon" href="/mark.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">

 <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">


  <style>
    :root {
      --bg: #0F1417;
      --text: #E8ECEB;
      --muted: #8A9694;
      --teal: #5CB3AD;
      --amber: #E7A94C;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Inter", system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    main {
      max-width: 36rem;
      width: 100%;
    }

    .name {
      font-family: "Montserrat", sans-serif;
      font-weight: 600;
      font-size: clamp(2.5rem, 8vw, 4.5rem);
      line-height: 1.05;
      letter-spacing: -0.02em;
    }

    .status {
      margin-top: 1.25rem;
      font-size: 1.125rem;
      color: var(--muted);
      line-height: 1.5;
    }

    .status::before {
      content: "";
      display: inline-block;
      width: 0.6rem;
      height: 0.6rem;
      border-radius: 50%;
      background: var(--amber);
      margin-right: 0.75rem;
      vertical-align: middle;
    }

    a {
      color: var(--teal);
      text-underline-offset: 0.2em;
    }

    a:focus-visible {
      outline: 2px solid var(--teal);
      outline-offset: 3px;
    }

    .contact {
      margin-top: 2rem;
      font-size: 1rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <h1 class="name">Jon Baldwin</h1>
    <p class="status">Website currently under construction.</p>
    <p class="contact">Get in touch: <a href="mailto:jon@jonmarkbaldwin.com">jon@jonmarkbaldwin.com</a></p>
  </main>
</body>
</html>
